worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/x-javascript
        application/xhtml+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/xhtml+xml;

    upstream php-fpm {
        server moodle:9000;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        listen 443 ssl;
        listen 443 quic reuseport;

        http2 on;

        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        root /var/www/html/public;
        index index.php index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 100M;

        # ---------------------------------------------------
        # LIVE COURSE WEBSOCKET
        # ---------------------------------------------------
        location /livecourse-ws {
            proxy_pass http://livecourse-ws:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 75s;
        }

        # ---------------------------------------------------
        # PHP MUST BE BEFORE STATIC FILE REGEX
        # ---------------------------------------------------
        location ~ ^(.+\.php)(/.+)?$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            fastcgi_pass php-fpm;
            fastcgi_index index.php;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param SERVER_PORT 8080;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;

            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_connect_timeout 60;

            fastcgi_buffering on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }

        # ---------------------------------------------------
        # STATIC FILES
        # ---------------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;

            add_header Cache-Control "public, immutable";
            add_header Alt-Svc 'h3=":443"; ma=86400';

            try_files $uri =404;

            gzip_static on;
            brotli_static on;
        }

        # ---------------------------------------------------
        # DEFAULT MOODLE ROUTING
        # ---------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ---------------------------------------------------
        # PROTECT MOODLEDATA
        # ---------------------------------------------------
        location ~ ^/moodledata {
            deny all;
        }

        # ---------------------------------------------------
        # BLOCK SENSITIVE FILES
        # ---------------------------------------------------
        location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
            deny all;
        }

        # ---------------------------------------------------
        # MAILPIT
        # ---------------------------------------------------
        location /mailpit/ {
            set $mailpit_upstream http://mailpit:8025;

            proxy_pass $mailpit_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;

            error_page 502 503 504 = @mailpit_unavailable;
        }

        location @mailpit_unavailable {
            default_type text/html;

            return 503 '<!DOCTYPE html><html><head><title>Mailpit Unavailable</title></head><body><h1>Mailpit not available</h1><p>Start the mailpit service with: <code>docker compose --profile dev up -d</code></p></body></html>';
        }

        # ---------------------------------------------------
        # NGINX HEALTH CHECK
        # ---------------------------------------------------
        location /nginx-health {
            access_log off;

            return 200 "healthy\n";

            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------
        # PHP-FPM STATUS
        # ---------------------------------------------------
        location /fpm-status {
            internal;

            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;

            include fastcgi_params;
        }
    }
}
