name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare validation environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_SECURE_PASSWORD/test_password_123/g' .env
          sed -i 's/CHANGE_ME_SECURE_ROOT_PASSWORD/test_root_456/g' .env
          sed -i 's/CHANGE_ME_SECURE_VALKEY_PASSWORD/test_valkey_789/g' .env

      - name: Validate Docker Compose files
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.traefik.yml config --quiet

      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck-alpine:stable \
            sh -c 'find /mnt/docker /mnt/scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck'

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0-alpine hadolint --ignore DL3018 - < docker/moodle/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.14.0-alpine hadolint --ignore DL3018 - < docker/nginx/Dockerfile
